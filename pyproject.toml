[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ai-counsel"
version = "0.2.1"
description = "MCP server for true deliberative consensus between AI models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "AI Counsel contributors" }]
keywords = ["mcp", "llm", "deliberation", "consensus", "claude", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "vcrpy>=4.4.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
]

[project.scripts]
ai-counsel = "server:cli"

[project.urls]
Homepage = "https://github.com/blueman82/ai-counsel"
Issues = "https://github.com/blueman82/ai-counsel/issues"

[tool.hatch.build.targets.wheel]
packages = [
    "adapters",
    "cli",
    "decision_graph",
    "deliberation",
    "models",
    "scripts",
]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"config.yaml" = "config.yaml"

[tool.hatch.build.targets.sdist]
include = [
    "server.py",
    "config.yaml",
    "adapters/",
    "cli/",
    "decision_graph/",
    "deliberation/",
    "models/",
    "scripts/",
    "README.md",
    "LICENSE",
    "CLAUDE.md",
    "docs/",
]
